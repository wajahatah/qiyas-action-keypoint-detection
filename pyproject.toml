[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiyas-akd"
version = "1.0.0"
description = "Keypoint-based exam-hall behaviour recognition (looking around, hand raise, hand in pocket) — research code from the Qiyas proctoring deployment."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Wajahat Ahmed" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
pose = ["ultralytics>=8.3", "opencv-python>=4.8"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8", "xgboost>=2.0", "lightgbm>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
