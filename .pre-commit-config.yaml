repos:
  - repo: local
    hooks:
      - id: sanitize
        name: sanitisation gate (no secrets, data, weights, names)
        entry: python scripts/sanitize_check.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff
        entry: ruff check .
        language: system
        pass_filenames: false
        types: [python]
