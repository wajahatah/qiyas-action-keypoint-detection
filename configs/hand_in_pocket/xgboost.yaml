# Approach C: XGBoost on 5-frame windows of normalised keypoints (time-major layout, no position),
# any-one label; 100 trees, depth 3, learning rate 0.1. Needs the optional `boosting` extra.
name: xgboost
model:
  kind: xgboost
  params: {n_estimators: 100, max_depth: 3, learning_rate: 0.1}
data:
  normalise: frame
  decimals: null
  position_features: false
  windowing: {window: 5, stride: 1, label_rule: any, layout: time_major}
  balance: {method: none}
synthetic: {n_videos: 8, n_desks: 4, n_frames: 150, seed: 0}
output_dir: outputs/hand_in_pocket
